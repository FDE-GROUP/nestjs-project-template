          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Delete a file
      tags: *ref_13
  /api/v1/storage/{key}/url:
    get:
      operationId: StorageController_getFileUrl_v1
      parameters:
        - name: key
          required: true
          in: path
          description: Unique identifier of the file
          schema:
            type: string
        - name: expiresIn
          required: false
          in: query
          description: Expiration time for URL (seconds)
          schema:
            type: number
      responses:
        '200':
          description: ''
      summary: Get a signed URL for a file
      tags: *ref_13
  /api/v1/payment/test:
    get:
      operationId: PaymentController_test_v1
      parameters: []
      responses:
        '200':
          description: Current provider selection and available channels
      summary: Payment integration status
      tags: &ref_14
        - payment
  /api/v1/payment/customers:
    post:
      operationId: PaymentController_createCustomer_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerDto'
