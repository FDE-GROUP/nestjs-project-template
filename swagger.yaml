openapi: 3.1.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check_v1
      parameters: []
      responses:
        '200':
          description: |-
            Service is alive.

            The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type:
                      - object
                      - 'null'
                    example: &ref_0
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example: *ref_0
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type:
                      - object
                      - 'null'
                    example:
                      database: &ref_1
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example:
                      redis: &ref_2
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example:
                      database: *ref_1
                      redis: *ref_2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: Liveness probe (ping-only, no dependency checks)
      tags:
        - Health
  /api/v1/tenants/roles:
    get:
      operationId: AuthorizationAdminController_listRoles_v1
      parameters: []
      responses:
        '200':
          description: Role views.
        '403':
          description: CASL deny (no Role read).
      summary: List roles of the active tenant (system + custom)
      tags: &ref_3
        - tenants
    post:
      operationId: AuthorizationAdminController_createRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleDto'
      responses:
        '200':
          description: Created role view.
        '400':
          description: Invalid/reserved role key.
        '409':
          description: Role key already exists.
      summary: Create a custom role (owner/admin)
      tags: *ref_3
  /api/v1/tenants/roles/rename:
    post:
      operationId: AuthorizationAdminController_renameRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRoleDto'
      responses:
        '200':
          description: Renamed.
        '404':
          description: Role not found.
        '409':
          description: System role protected.
      summary: Rename a custom role (system roles protected)
      tags: *ref_3
  /api/v1/tenants/roles/delete:
    post:
      operationId: AuthorizationAdminController_deleteRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRoleDto'
      responses:
        '200':
          description: Deleted.
        '404':
          description: Role not found.
        '409':
          description: System role protected.
      summary: Delete a custom role (grants cascade; system roles protected)
      tags: *ref_3
  /api/v1/tenants/roles/grants:
    get:
      operationId: AuthorizationAdminController_listGrants_v1
      parameters:
        - name: roleKey
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Grant views (subject/action/conditions).
        '404':
          description: Role not found.
      summary: List grant rows of a role (echo checked state)
      tags: *ref_3
    post:
      operationId: AuthorizationAdminController_grant_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRolePermissionDto'
      responses:
        '200':
          description: Granted.
        '400':
          description: Invalid conditions (whitelist-only).
        '404':
          description: Role not found.
        '409':
          description: Duplicate grant.
      summary: Grant a permission cell to a role (multi-condition rows = OR union)
      tags: *ref_3
  /api/v1/tenants/roles/grants/revoke:
    post:
      operationId: AuthorizationAdminController_revoke_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRolePermissionDto'
      responses:
        '200':
          description: Revoked.
        '404':
          description: Role or matching grant not found.
      summary: Revoke a grant (conditions null = whole-subject row; object = exact row)
      tags: *ref_3
  /api/v1/platform/tenants:
    get:
      operationId: PlatformTenantsController_list_v1
      parameters:
        - name: limit
          required: false
          in: query
          description: Page size (1-100)
          schema:
            example: 20
        - name: offset
          required: false
          in: query
          description: Offset (rows to skip)
          schema:
            example: 0
        - name: search
          required: false
          in: query
          description: Match against tenant name or slug (substring)
          schema:
            type: string
      responses:
        '200':
          description: A page of tenants with lifecycle status.
        '403':
          description: Not the platform operator.
      summary: List all tenants across the platform (operator only)
      tags: &ref_4
        - platform
  /api/v1/platform/tenants/{id}:
    get:
      operationId: PlatformTenantsController_detail_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Tenant row.
        '404':
          description: Tenant not found.
      summary: Get one tenant (operator only)
      tags: *ref_4
    delete:
      operationId: PlatformTenantsController_remove_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Tenant marked deleted.
        '404':
          description: Tenant not found.
        '409':
          description: Already deleted (illegal transition).
      summary: Soft-delete a tenant (→ deleted terminal · row kept for export)
      tags: *ref_4
  /api/v1/platform/tenants/{id}/diagnostics:
    get:
      operationId: PlatformTenantsController_diagnostics_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Diagnostics bundle.
        '404':
          description: Tenant not found.
      summary: 'Per-tenant diagnostics: member/invitation/workspace/post counts'
      tags: *ref_4
  /api/v1/platform/tenants/{id}/export:
    get:
      operationId: PlatformTenantsController_exportData_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Six-section tenant data export (credentials excluded).
        '404':
          description: Tenant not found.
      summary: Export all tenant-owned data as a single JSON payload (NFR-6)
      tags: *ref_4
  /api/v1/platform/tenants/{id}/suspend:
    patch:
      operationId: PlatformTenantsController_suspend_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Tenant suspended.
        '404':
          description: Tenant not found.
        '409':
          description: Illegal transition for the current status.
      summary: Suspend an active tenant (active → suspended · fail-closed失能)
      tags: *ref_4
  /api/v1/platform/tenants/{id}/resume:
    patch:
      operationId: PlatformTenantsController_resume_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Tenant resumed.
        '404':
          description: Tenant not found.
        '409':
          description: Illegal transition for the current status.
      summary: Resume a suspended tenant (suspended → active)
      tags: *ref_4
  /api/v1/platform/tenants/{id}/permanent:
    delete:
      operationId: PlatformTenantsController_permanentRemove_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Tenant rows purged; payload carries purgedEvents for audit核对.
        '404':
          description: Tenant not found (or already hard-deleted · idempotent).
        '409':
          description: Not in deleted terminal state — soft-delete first.
      summary: >-
        Hard-delete a deleted-terminal tenant (irreversible · FK cascade + event
        purge · NFR-6)
      tags: *ref_4
  /api/v1/platform/users:
