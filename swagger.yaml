        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceDto'
      responses:
        '200':
          description: Updated workspace.
        '404':
          description: Workspace not found in the active tenant.
      summary: Update a workspace (owner/admin)
      tags: *ref_8
    delete:
      operationId: WorkspacesController_remove_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Workspace deleted.
        '404':
          description: Workspace not found in the active tenant.
      summary: Delete a workspace (owner/admin)
      tags: *ref_8
  /api/v1/tenants/applications:
