info:
  title: NestJS SaaS Start API
  description: NestJS SaaS Start API documentation
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateRoleDto:
      type: object
      properties:
        key:
          type: string
          description: Tenant-scoped role key (system key or custom key)
          example: editor
        name:
          type: string
          description: Human-readable role name
          example: Editor
      required:
        - key
        - name
    RenameRoleDto:
      type: object
      properties:
        key:
          type: string
          description: Tenant-scoped role key (system key or custom key)
          example: editor
        name:
          type: string
          description: New human-readable role name
          example: Editors
      required:
        - key
        - name
    DeleteRoleDto:
      type: object
      properties:
        key:
          type: string
          description: Tenant-scoped role key (system key or custom key)
          example: editor
      required:
        - key
    GrantRolePermissionDto:
      type: object
      properties:
        roleKey:
          type: string
          description: Tenant-scoped role key (system key or custom key)
          example: editor
        subject:
          type: string
          description: Subject resource
          enum: &ref_15
            - Organization
            - Member
            - Invitation
            - Workspace
            - Role
            - RoleGrant
        action:
          type: string
          description: Action
          enum: &ref_16
            - create
            - read
            - update
            - delete
            - cancel
        conditions:
          type: object
          description: >-
            Instance-level conditions (whitelist-checked server-side; omit =
            whole-subject grant)
          example: &ref_17
            ownerId: '{{userId}}'
      required:
        - roleKey
        - subject
        - action
    RevokeRolePermissionDto:
      type: object
      properties:
        roleKey:
          type: string
          description: Tenant-scoped role key (system key or custom key)
          example: editor
        subject:
          type: string
          description: Subject resource
          enum: *ref_15
        action:
          type: string
          description: Action
          enum: *ref_16
        conditions:
          type: object
          description: >-
            Instance-level conditions (whitelist-checked server-side; omit =
            whole-subject grant)
          example: *ref_17
      required:
        - roleKey
        - subject
        - action
    SuspendUserDto:
      type: object
      properties:
        reason:
          type: string
          description: Free-text suspension reason (audit trail)
    CreatePostDto:
      type: object
      properties:
        title:
          type: string
          description: The title of the post
          example: Hello tenant
        content:
          type: string
          description: The post body
          example: Content...
        published:
          type: boolean
          description: Whether the post is published
          example: false
      required:
        - title
    CreateWorkspaceDto:
      type: object
      properties:
        name:
          type: string
          description: Workspace display name
          example: Design
        slug:
          type: string
          description: URL-friendly slug (unique within the tenant)
          example: design
      required:
        - name
        - slug
    UpdateWorkspaceDto:
      type: object
      properties:
        name:
          type: string
          description: Workspace display name
          example: Design
        slug:
          type: string
          description: URL-friendly slug
          example: design
    CreateTenantApplicationDto:
      type: object
      properties:
        name:
          type: string
          description: Tenant display name
          example: Acme Inc.
        slug:
          type: string
          description: Globally-unique tenant slug
          example: acme
      required:
        - name
        - slug
    UpdateMemberRoleDto:
      type: object
      properties:
        memberId:
          type: string
          description: Member id to update
          example: member-1
        role:
          type: object
          description: New tenant role (system key or existing custom role key)
          example: admin
      required:
        - memberId
        - role
    RemoveMemberDto:
      type: object
      properties:
        memberId:
          type: string
          description: Member id to remove
          example: member-1
      required:
        - memberId
    CreateInvitationDto:
      type: object
      properties:
        email:
          type: string
          description: Invitee email
          example: new@acme.com
        role:
          type: object
          description: Role granted on accept (system key or existing custom role key)
          example: member
      required:
        - email
        - role
    InvitationIdDto:
      type: object
      properties:
        invitationId:
          type: string
          description: Invitation id
          example: inv-1
      required:
        - invitationId
    SetActiveTenantDto:
      type: object
      properties:
        organizationId:
          type: string
          description: Organization id to activate in session
          example: org_1
      required:
        - organizationId
    LeaveTenantDto:
      type: object
      properties:
        organizationId:
          type: string
          description: Organization id to leave
          example: org_1
      required:
        - organizationId
    CreateSubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          description: Subscription plan/tier
          enum:
            - free
            - pro
            - enterprise
          example: pro
        customerEmail:
          type: string
          description: Billing contact email (creates the provider customer · FR-8)
        seatsLimit:
          type: number
          description: Override the plan seat limit (defaults to the plan)
        storageQuota:
          type: number
          description: Storage quota (bytes) placeholder
        apiQuota:
          type: number
          description: API quota placeholder
      required:
        - plan
        - customerEmail
    CreateCustomerDto:
      type: object
      properties:
        email:
          type: string
          description: Customer email address
          example: customer@example.com
        name:
          type: string
          description: Customer name
          example: John Doe
        metadata:
          type: object
          description: Set of key-value pairs for additional information
          example:
            userId: '1234'
      required:
        - email
    CreateCheckoutDto:
      type: object
      properties:
        amount:
          type: number
          description: Amount in smallest currency unit (e.g., cents for USD)
          example: 2000
        currency:
          type: string
          description: Three-letter ISO currency code
          example: usd
        description:
          type: string
          description: Description of the checkout
          example: 'Payment for order #1234'
        metadata:
          type: object
          description: Set of key-value pairs for additional information
          example:
            orderId: '1234'
      required:
        - amount
        - currency
    RefundPaymentDto:
      type: object
      properties:
        checkoutId:
          type: string
          description: Checkout (payment intent) id to refund
          example: pi_1AbcDef
        amount:
          type: number
          description: Amount to refund (defaults to full amount when omitted)
          example: 500
        reason:
          type: string
          description: Refund reason
          example: requested_by_customer
      required:
        - checkoutId
