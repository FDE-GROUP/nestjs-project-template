version: '3.8'

services:
  app:
    container_name: nestjs-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7009:7009"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/nestjs_practice
      - PORT=7009
      # HOST 不在此声明：监听默认单一真源在 `Dockerfile`（`ENV HOST=0.0.0.0`），避免双源漂移。
      # `NODE_ENV=production` 使 PIPL 驻留检查进 strict；本图内 DB 主机是服务名 `postgres`，不属内置
      # 境内白名单（localhost / RFC1918 / .cn / 阿里云 / 腾讯云），故必须显式窄放行该服务名。
      # 只放行图内主机，strict 的其余校验（含 storage region）继续生效——不得改用
      # `DATA_RESIDENCY_ENFORCE=false` 整闸关闭换取可启动。
      # 境外自建 / 云主机部署：将其改为具体的境内 IDC 或云 DB 主机名，或在确认合规后删除本行。
      - DATA_RESIDENCY_DB_HOST_ALLOWLIST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs-network
    volumes:
      - ./.env:/app/.env
      - app-logs:/app/logs

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nestjs_practice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_practice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  nestjs-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local
