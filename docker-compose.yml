version: '3.8'

services:
  app:
    container_name: nestjs-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7009:7009"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/nestjs_practice
      - PORT=7009
      # HOST 不在此声明：监听默认单一真源在 `Dockerfile`（`ENV HOST=0.0.0.0`），避免双源漂移。
      # `NODE_ENV=production` 使 PIPL 驻留检查进 strict；本图内 DB 主机是服务名 `postgres`，不属内置
      # 境内白名单（localhost / RFC1918 / .cn / 阿里云 / 腾讯云），故必须显式窄放行该服务名。
      # 只放行图内主机，strict 的其余校验（含 storage region）继续生效——不得改用
      # `DATA_RESIDENCY_ENFORCE=false` 整闸关闭换取可启动。
      # 境外自建 / 云主机部署：将其改为具体的境内 IDC 或云 DB 主机名，或在确认合规后删除本行。
      - DATA_RESIDENCY_DB_HOST_ALLOWLIST=postgres
      # 策略开关必须由编排钉死为 true：`@nestjs/config` 会把「不存在于 process.env」的 .env 键
      # 回填进 process.env（可补缺、不可覆有），本行若不声明，挂载文件里一行
      # `DATA_RESIDENCY_ENFORCE=false` 即可把生产 strict 静默降为 warn。声明后文件覆不动它。
      - DATA_RESIDENCY_ENFORCE=true
      # ORM 修宪案 B · 双轨翻缺省（G1 使能）：本部署图的 BA 数据面缺省翻为自持 Mikro adapter（人授「把运维的活
      # 一起干了」2026-10-16）。注：代码缺省仍 drizzle（auth.implement.ts:95），本行只影响容器运时·dev/
      # `nest start` 与假设 drizzle 缺省的单测均不受影响。一键回滚＝删本行重启免重部署；drizzleAdapter
      # 分支与旧类均未删（contract 未启动）。本翻缺省不等于 G1 整体达成（G2 观察期/真环部署归运维）·
      # 更不解锁 contract：4-β～4-ζ（删 drizzle 分支/依赖/改宪法）仍逐批人明示签核。
      - BA_ADAPTER=mikro
      # 以下 8 项是 Joi required 或驻留判定的输入事实，过去只由挂载的宿主 `.env` 暗供
      # （同一张图在不同开发机上合规结论相反）。改为编排显式插值：`docker compose config` 可见、
      # 缺值在 up 前即失败（退出码 1）。插值源就是宿主项目目录的 `./.env` 或 shell 环境，
      # 因此不引入新文件、不新增密钥副本。
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required by the deployment env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required by the deployment env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required by the deployment env}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-alioss}
      - STORAGE_REGION=${STORAGE_REGION:?STORAGE_REGION is required by the deployment env}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required by the deployment env}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID is required by the deployment env}
      - STORAGE_ACCESS_KEY_SECRET=${STORAGE_ACCESS_KEY_SECRET:?STORAGE_ACCESS_KEY_SECRET is required by the deployment env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs-network
    volumes:
      # 挂载保留，但从此只负责「非决策性」键的补缺（mailer / oauth / stripe / 应用元数据等）：
      # 策略开关与驻留判定输入已全部上到上面的 environment，文件再也覆不动它们。
      # 生产部署应改用自身的 env 来源，不要把开发机 .env 挂进生产容器。
      - ./.env:/app/.env
      - app-logs:/app/logs

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nestjs_practice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_practice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  nestjs-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local
