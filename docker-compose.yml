version: '3.8'

services:
  app:
    container_name: nestjs-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7009:7009"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/nestjs_practice
      - PORT=7009
      - HOST=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs-network
    volumes:
      - ./.env:/app/.env
      - app-logs:/app/logs

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nestjs_practice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_practice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  nestjs-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local
