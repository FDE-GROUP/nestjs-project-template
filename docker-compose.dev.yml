version: '3.8'

services:
  postgres:
    container_name: postgres-dev
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nestjs_practice
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - nestjs-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_practice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  nestjs-network-dev:
    driver: bridge

volumes:
  postgres-data-dev:
    driver: local
