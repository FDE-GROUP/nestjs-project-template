# pnpm 工作区（isolated 严格布局·切片 A 实证 R-α 证伪，无需 hoist）
packages:
  - apps/*
  - libs/*

# 构建脚本白名单（pnpm 11 默认拦 postinstall 以护供应链）。@swc/core / esbuild 放行以链接
# 平台原生二进制；@scarf/scarf 为遥测上报，显式拒绝（false）。
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@scarf/scarf': false
  # testcontainers 的可选原生面（SSH 传输/docker-compose 解析）：本仓只用本地 Docker + PG 模块，
  # 不碰 SSH/compose——显式拒建（ssh2 对 cpu-features 自带 try/catch 降级，protobufjs 仅收尾脚本）。
  cpu-features: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.45'
  - '@tanstack/router-core@1.171.38'
  - '@tanstack/router-generator@1.167.45'
  - '@tanstack/router-plugin@1.168.47'
